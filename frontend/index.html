<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <title>Link Bajar — Buy & Sell Guest Posts and Backlinks</title>
    <meta name="description" content="Link Bajar is the marketplace for guest posts, link insertions, HARO outreach and SEO services. Connect with vetted publishers worldwide." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Link Bajar — SEO Link Marketplace" />
    <meta property="og:description" content="Buy guest posts, link insertions, HARO and PR placements from vetted publishers." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://linkbajar.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Link Bajar — SEO Link Marketplace" />
    <meta name="twitter:description" content="Buy guest posts, link insertions, HARO and PR placements from vetted publishers." />

    <link rel="canonical" href="https://linkbajar.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Link Bajar",
        "url": "https://linkbajar.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://linkbajar.com/marketplace?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
