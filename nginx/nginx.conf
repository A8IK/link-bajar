user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{ "time":"$time_iso8601", "remote":"$remote_addr", "method":"$request_method",'
      '"uri":"$request_uri", "status":$status, "rt":$request_time, "ua":"$http_user_agent" }';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static cache (frontend)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Rate limiting at the edge
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Backend upstream — scale via `docker compose up --scale backend=N`
    upstream backend_pool {
        least_conn;
        # Docker DNS resolves all replica IPs on each lookup
        server backend:4000 max_fails=3 fail_timeout=20s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Frontend (static)
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Hashed static assets — long-lived cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_pass http://backend_pool;
        }

        # Socket.IO
        location /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_pass http://backend_pool;
        }

        # Health
        location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    }
}
